<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Unblocker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #1a1a1a 0%, #0d0d0d 100%);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background: rgba(0, 0, 0, 0.8);
            border-right: 2px solid #ffffff;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .sidebar-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .sidebar-title {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #ffffff;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            text-transform: uppercase;
        }

        .feature-btn {
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            color: #ffffff;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.3s ease;
            text-align: left;
        }

        .feature-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateX(5px);
        }

        .feature-btn:active {
            transform: translateX(3px);
        }

        .feature-icon {
            margin-right: 8px;
        }

        .history-item {
            padding: 10px 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            cursor: pointer;
            font-size: 11px;
            word-break: break-all;
            transition: all 0.2s ease;
            color: rgba(255, 255, 255, 0.8);
        }

        .history-item:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.3);
            color: #ffffff;
        }

        .clear-history {
            padding: 8px 12px;
            background: rgba(255, 0, 0, 0.1);
            border: 1px solid rgba(255, 0, 0, 0.3);
            border-radius: 5px;
            color: rgba(255, 255, 255, 0.8);
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            transition: all 0.2s ease;
            text-align: center;
        }

        .clear-history:hover {
            background: rgba(255, 0, 0, 0.2);
            border-color: rgba(255, 0, 0, 0.5);
            color: #ffffff;
        }

        /* Main Content Area */
        .content-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header */
        .header {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            padding: 20px 30px;
            border-bottom: 2px solid #ffffff;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .header-content {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo {
            font-size: 32px;
        }

        .title {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        /* URL Input Section */
        .url-input-section {
            background: rgba(0, 0, 0, 0.4);
            padding: 15px 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .input-container {
            display: flex;
            gap: 10px;
        }

        .url-input {
            flex: 1;
            padding: 12px 18px;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #ffffff;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        .url-input:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.12);
            border-color: #ffffff;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
        }

        .url-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .go-btn {
            padding: 12px 30px;
            background: #ffffff;
            color: #000000;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 15px;
            min-width: 100px;
        }

        .go-btn:hover {
            background: #e0e0e0;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 255, 255, 0.2);
        }

        .go-btn:active {
            transform: translateY(0);
        }

        /* Browser Content */
        .browser-content {
            flex: 1;
            overflow: auto;
            background: #0d0d0d;
            position: relative;
        }

        .proxy-frame {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        .loading-indicator {
            position: absolute;
            top: 20px;
            right: 30px;
            display: none;
            color: #ffffff;
            font-size: 14px;
            z-index: 100;
        }

        .loading-indicator.active {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Status Bar */
        .status-bar {
            background: rgba(0, 0, 0, 0.6);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 30px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
        }

        /* Error Message */
        .error-container {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            border: 2px solid #ffffff;
            border-radius: 10px;
            padding: 30px;
            max-width: 400px;
            text-align: center;
            z-index: 200;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.9);
        }

        .error-container.active {
            display: block;
        }

        .error-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 15px;
            color: #ffffff;
        }

        .error-message {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .error-close {
            padding: 10px 20px;
            background: #ffffff;
            color: #000000;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .error-close:hover {
            background: #e0e0e0;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar {
                width: 0;
                padding: 0;
                border: none;
            }

            .title {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <!-- Left Sidebar -->
        <div class="sidebar">
            <!-- Quick Features -->
            <div class="sidebar-section">
                <div class="sidebar-title">🚀 Quick Access</div>
                <button class="feature-btn" onclick="loadPredefined('https://youtube.com')"><span class="feature-icon">▶️</span>YouTube</button>
                <button class="feature-btn" onclick="loadPredefined('https://reddit.com')"><span class="feature-icon">📱</span>Reddit</button>
                <button class="feature-btn" onclick="loadPredefined('https://twitter.com')"><span class="feature-icon">𝕏</span>Twitter/X</button>
                <button class="feature-btn" onclick="loadPredefined('https://twitch.tv')"><span class="feature-icon">🎮</span>Twitch</button>
                <button class="feature-btn" onclick="loadPredefined('https://discord.com')"><span class="feature-icon">💬</span>Discord</button>
                <button class="feature-btn" onclick="loadPredefined('https://netflix.com')"><span class="feature-icon">🎬</span>Netflix</button>
            </div>

            <!-- Tools -->
            <div class="sidebar-section">
                <div class="sidebar-title">⚙️ Tools</div>
                <button class="feature-btn" onclick="copyCurrentURL()"><span class="feature-icon">📋</span>Copy URL</button>
                <button class="feature-btn" onclick="goBack()"><span class="feature-icon">⬅️</span>Go Back</button>
                <button class="feature-btn" onclick="goForward()"><span class="feature-icon">➡️</span>Go Forward</button>
                <button class="feature-btn" onclick="reloadPage()"><span class="feature-icon">🔄</span>Refresh</button>
            </div>

            <!-- History -->
            <div class="sidebar-section">
                <div class="sidebar-title">📜 History</div>
                <div id="historyContainer" style="display: flex; flex-direction: column; gap: 8px;">
                    <div style="font-size: 12px; color: rgba(255, 255, 255, 0.5); text-align: center;">No history yet</div>
                </div>
                <button class="clear-history" onclick="clearHistory()">Clear History</button>
            </div>

            <!-- Info -->
            <div class="sidebar-section">
                <div class="sidebar-title">ℹ️ Info</div>
                <div style="font-size: 11px; color: rgba(255, 255, 255, 0.6); line-height: 1.6;">
                    <p>🔓 <strong>Unblocker</strong></p>
                    <p>Uses Allorigins public proxy API to bypass restrictions.</p>
                    <p>📡 Fast & Reliable</p>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="content-area">
            <!-- Header -->
            <div class="header">
                <div class="header-content">
                    <div class="logo">🔓</div>
                    <div class="title">WEB UNBLOCKER</div>
                </div>
            </div>

            <!-- URL Input -->
            <div class="url-input-section">
                <div class="input-container">
                    <input 
                        type="text" 
                        class="url-input" 
                        id="urlInput" 
                        placeholder="Enter URL (e.g., https://example.com)"
                        autocomplete="off"
                    >
                    <button class="go-btn" onclick="loadPage()">GO 🚀</button>
                </div>
            </div>

            <!-- Browser Content -->
            <div class="browser-content" id="browserContent">
                <div class="loading-indicator" id="loadingIndicator">
                    <div class="spinner"></div>
                    <span>Loading...</span>
                </div>
                <div class="error-container" id="errorContainer">
                    <div class="error-title">⚠️ Error</div>
                    <div class="error-message" id="errorMessage"></div>
                    <button class="error-close" onclick="closeError()">Close</button>
                </div>
                <iframe class="proxy-frame" id="proxyFrame" title="Proxy Content"></iframe>
            </div>

            <!-- Status Bar -->
            <div class="status-bar">
                <span id="statusText">🚀 Ready • Enter a URL to begin unblocking</span>
            </div>
        </div>
    </div>

    <script>
        const urlInput = document.getElementById('urlInput');
        const proxyFrame = document.getElementById('proxyFrame');
        const loadingIndicator = document.getElementById('loadingIndicator');
        const errorContainer = document.getElementById('errorContainer');
        const errorMessage = document.getElementById('errorMessage');
        const statusText = document.getElementById('statusText');
        const historyContainer = document.getElementById('historyContainer');

        // Public proxy service - Allorigins
        const PROXY_API = 'https://api.allorigins.win/raw?url=';
        let history = JSON.parse(localStorage.getItem('unblockerHistory')) || [];

        function formatURL(input) {
            if (!input.trim()) return '';
            
            if (!input.startsWith('http://') && !input.startsWith('https://')) {
                return 'https://' + input;
            }
            return input;
        }

        function showError(title, message) {
            errorMessage.textContent = message;
            errorContainer.classList.add('active');
            statusText.textContent = '❌ Error: ' + message;
        }

        function closeError() {
            errorContainer.classList.remove('active');
        }

        function showLoading(show) {
            if (show) {
                loadingIndicator.classList.add('active');
                statusText.textContent = '⏳ Loading...';
            } else {
                loadingIndicator.classList.remove('active');
            }
        }

        function addToHistory(url) {
            if (!history.includes(url)) {
                history.unshift(url);
                if (history.length > 10) history.pop();
                localStorage.setItem('unblockerHistory', JSON.stringify(history));
                updateHistoryUI();
            }
        }

        function updateHistoryUI() {
            if (history.length === 0) {
                historyContainer.innerHTML = '<div style="font-size: 12px; color: rgba(255, 255, 255, 0.5); text-align: center;">No history yet</div>';
                return;
            }

            historyContainer.innerHTML = history.map((url, index) => 
                `<div class="history-item" onclick="loadPredefined('${url}')" title="${url}">
                    🕐 ${url.replace('https://', '').replace('http://', '').substring(0, 25)}...
                </div>`
            ).join('');
        }

        function clearHistory() {
            history = [];
            localStorage.removeItem('unblockerHistory');
            updateHistoryUI();
            statusText.textContent = '🗑️ History cleared';
        }

        function loadPredefined(url) {
            urlInput.value = url;
            loadPage();
        }

        function loadPage() {
            const url = formatURL(urlInput.value);
            
            if (!url) {
                showError('Invalid URL', 'Please enter a valid website URL');
                return;
            }

            closeError();
            showLoading(true);
            statusText.textContent = `📡 Fetching: ${url}`;

            try {
                const proxyURL = PROXY_API + encodeURIComponent(url);
                
                proxyFrame.src = '';
                
                const timeoutId = setTimeout(() => {
                    showLoading(false);
                    showError(
                        'Connection Timeout',
                        'The request took too long. Try again or use a different URL.'
                    );
                }, 15000);

                proxyFrame.onload = () => {
                    clearTimeout(timeoutId);
                    showLoading(false);
                    statusText.textContent = `✅ Loaded: ${url}`;
                    addToHistory(url);
                };

                proxyFrame.onerror = () => {
                    clearTimeout(timeoutId);
                    showLoading(false);
                    showError(
                        'Failed to Load',
                        'The website could not be accessed. It may be blocked or unavailable.'
                    );
                };

                proxyFrame.src = proxyURL;
                
            } catch (error) {
                showLoading(false);
                showError('Error', error.message);
            }
        }

        function copyCurrentURL() {
            const url = urlInput.value;
            if (!url) {
                statusText.textContent = '⚠️ No URL to copy';
                return;
            }
            navigator.clipboard.writeText(url);
            statusText.textContent = '📋 URL copied to clipboard';
        }

        function goBack() {
            proxyFrame.contentWindow.history.back();
            statusText.textContent = '⬅️ Going back...';
        }

        function goForward() {
            proxyFrame.contentWindow.history.forward();
            statusText.textContent = '➡️ Going forward...';
        }

        function reloadPage() {
            if (urlInput.value) {
                loadPage();
            } else {
                statusText.textContent = '⚠️ No URL loaded';
            }
        }

        // Allow Enter key to load
        urlInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                loadPage();
            }
        });

        // Initialize
        updateHistoryUI();
        window.addEventListener('load', () => {
            urlInput.focus();
        });
    </script>
</body>
</html>
